<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vulpes — An Arctic Fox</title>
<meta name="description" content="A realtime 3D arctic fox rendered in WebGL: shell-based fur, procedural anatomy, physically based snow and aurora." />
<meta name="theme-color" content="#0a1220" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#070c14; }
  body { font: 400 14px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#e8eef7;
         -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
  #stage { position:fixed; inset:0; display:block; width:100%; height:100%; touch-action:none; }
  #ui { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #ui > * { pointer-events:auto; }
  .nosel { user-select:none; -webkit-user-select:none; }
</style>
</head>
<body class="nosel">
  <canvas id="stage"></canvas>
  <div id="ui"></div>
  <noscript style="position:fixed;inset:0;display:grid;place-items:center;padding:2rem;text-align:center">
    This experience requires JavaScript and WebGL2.
  </noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
